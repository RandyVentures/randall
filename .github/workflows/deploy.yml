name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # 08:00 America/Chicago during the October 2026 release series (CDT): rental series Oct 9-15, then Oct 19, 21, 22, 23, 24.
    # Rebuilds make due posts visible; GitHub may start scheduled runs late.
    - cron: '0 13 9,11,13,15,19,21,22,23,24 10 *'
    # Landlord SEO series at 08:00 America/Chicago: Oct 27 and 29 (CDT), then Nov 3, 5 and 10 (CST).
    - cron: '0 13 27,29 10 *'
    - cron: '0 14 3,5,10 11 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
