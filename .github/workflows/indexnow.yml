name: IndexNow public content updates

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    types: [completed]
    branches: [master]
  schedule:
    - cron: '27,57 * * * *'

permissions:
  contents: read

concurrency:
  group: indexnow-public-content
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache/restore@v5
        with:
          path: scripts/indexnow/state
          key: indexnow-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-state-v1-
      - name: Check public URL safeguards
        run: node --test scripts/indexnow/sweep.test.mjs
      - name: Notify added, changed and deleted public pages
        run: node scripts/indexnow/sweep.mjs --send
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: scripts/indexnow/state
          key: indexnow-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: indexnow-submission-report
          path: scripts/indexnow/last-run.json
          retention-days: 14
