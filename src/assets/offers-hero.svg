<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="An intro price card and a welcome-back card side by side">
  <rect width="1200" height="630" fill="#f4efe6"/>
  <rect x="0" y="560" width="1200" height="70" fill="#ebe4d7"/>
  <g transform="rotate(-4 340 315)">
    <rect x="130" y="130" width="420" height="330" rx="28" fill="#fffcf6" stroke="#1c1915" stroke-opacity="0.18" stroke-width="2"/>
    <rect x="130" y="130" width="420" height="78" rx="28" fill="#b8431c"/>
    <rect x="130" y="180" width="420" height="28" fill="#b8431c"/>
    <text x="165" y="182" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#fff6ef" letter-spacing="1">INTRO PRICE</text>
    <text x="165" y="320" font-family="Georgia, serif" font-size="110" font-weight="700" fill="#1c1915">$4.99</text>
    <text x="165" y="370" font-family="Georgia, serif" font-size="30" fill="#463f36">first week</text>
    <text x="165" y="425" font-family="Georgia, serif" font-size="24" fill="#6e665a">then the regular weekly price</text>
  </g>
  <g transform="rotate(3 860 315)">
    <rect x="650" y="150" width="420" height="330" rx="28" fill="#fffcf6" stroke="#1c1915" stroke-opacity="0.18" stroke-width="2"/>
    <rect x="650" y="150" width="420" height="78" rx="28" fill="#2b6a4d"/>
    <rect x="650" y="200" width="420" height="28" fill="#2b6a4d"/>
    <text x="685" y="202" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#fff6ef" letter-spacing="1">WELCOME BACK</text>
    <path d="M740 340 q40 -70 90 -20 q40 40 90 -10" fill="none" stroke="#2b6a4d" stroke-width="10" stroke-linecap="round"/>
    <path d="M900 292 l24 18 l-30 8" fill="none" stroke="#2b6a4d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="685" y="410" font-family="Georgia, serif" font-size="30" fill="#463f36">an offer for people who left</text>
    <text x="685" y="448" font-family="Georgia, serif" font-size="30" fill="#463f36">and might come back</text>
  </g>
</svg>
